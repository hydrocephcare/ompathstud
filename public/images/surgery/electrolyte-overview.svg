<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12304a"/><stop offset="1" stop-color="#1f5274"/></linearGradient><style>text{font-family:Inter,Arial,sans-serif;fill:#17324a}.title{font-size:34px;font-weight:750;fill:#fff}.sub{font-size:17px;fill:#dbeafe}.h{font-size:21px;font-weight:700}.t{font-size:17px}.small{font-size:14px;fill:#526779}.card{fill:#fff;stroke:#d6e2ed;stroke-width:2}.label{font-size:16px;font-weight:700}.line{stroke:#47657c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/><rect width="1200" height="112" rx="28" fill="url(#navy)"/><rect y="84" width="1200" height="28" fill="url(#navy)"/><text x="54" y="52" class="title">Electrolytes: high-yield surgical relevance</text><text x="56" y="82" class="sub">Interpret serum results with renal function, fluid status, ECG and clinical context</text>
<rect x="55" y="150" width="1090" height="465" rx="22" class="card"/>
<g transform="translate(95 200)">
<rect x="0" y="0" width="455" height="145" rx="18" fill="#eaf2fa" stroke="#d5e1ea" stroke-width="2"/><text x="24" y="38" class="h">Sodium (Na⁺)</text><text x="24" y="75" class="label">135–145 mmol/L</text><text x="24" y="112" class="small">Water balance • brain symptoms</text><rect x="500" y="0" width="455" height="145" rx="18" fill="#fde8e6" stroke="#d5e1ea" stroke-width="2"/><text x="524" y="38" class="h">Potassium (K⁺)</text><text x="524" y="75" class="label">3.5–5.0 mmol/L</text><text x="524" y="112" class="small">Muscle function • cardiac conduction</text><rect x="0" y="175" width="455" height="145" rx="18" fill="#e9f5ee" stroke="#d5e1ea" stroke-width="2"/><text x="24" y="213" class="h">Magnesium (Mg²⁺)</text><text x="24" y="250" class="label">~0.7–1.0 mmol/L</text><text x="24" y="287" class="small">Neuromuscular function • refractory low K⁺</text><rect x="500" y="175" width="455" height="145" rx="18" fill="#fff2dc" stroke="#d5e1ea" stroke-width="2"/><text x="524" y="213" class="h">Phosphate (PO₄³⁻)</text><text x="524" y="250" class="label">~0.8–1.5 mmol/L</text><text x="524" y="287" class="small">ATP • diaphragm and muscle function</text>
<text x="0" y="390" class="small">Reference intervals vary by laboratory. Severe abnormalities or symptoms require urgent protocol-led assessment.</text>
</g></svg>