<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><rect width="100%" height="100%" fill="#f8fafc"/><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#15324b">Multimodal postoperative pain control</text><rect x="60" y="95" width="880" height="54" rx="12" fill="#e8f1fb" stroke="#7892ad" stroke-width="2"/><text x="500" y="130" text-anchor="middle" font-family="Arial" font-size="21" fill="#17324d">BASE: paracetamol when appropriate</text><rect x="60" y="167" width="880" height="54" rx="12" fill="#edf6f0" stroke="#7892ad" stroke-width="2"/><text x="500" y="202" text-anchor="middle" font-family="Arial" font-size="21" fill="#17324d">ADD: NSAID only if renal, bleeding and GI risks permit</text><rect x="60" y="239" width="880" height="54" rx="12" fill="#e8f1fb" stroke="#7892ad" stroke-width="2"/><text x="500" y="274" text-anchor="middle" font-family="Arial" font-size="21" fill="#17324d">ESCALATE: opioid for moderate/severe pain with sedation and respiratory monitoring</text><rect x="60" y="311" width="880" height="54" rx="12" fill="#edf6f0" stroke="#7892ad" stroke-width="2"/><text x="500" y="346" text-anchor="middle" font-family="Arial" font-size="21" fill="#17324d">PROCEDURE-SPECIFIC: local anaesthetic / regional techniques where indicated</text><text x="500" y="395" text-anchor="middle" font-family="Arial" font-size="16" fill="#526579">Individualise to the patient, procedure, contraindications and local protocol.</text></svg>