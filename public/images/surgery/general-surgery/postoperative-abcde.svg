<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="100%" height="100%" fill="#f8fafc"/><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#15324b">Postoperative ABCDE assessment</text><text x="80" y="145" font-family="Arial" font-size="25" fill="#17324d">A — Airway: patency, obstruction, airway adjuncts</text><text x="80" y="225" font-family="Arial" font-size="25" fill="#17324d">B — Breathing: respiratory rate, SpO2, chest examination</text><text x="80" y="305" font-family="Arial" font-size="25" fill="#17324d">C — Circulation: pulse, BP, perfusion, bleeding, urine</text><text x="80" y="385" font-family="Arial" font-size="25" fill="#17324d">D — Disability: consciousness, pupils, glucose, pain</text><text x="80" y="465" font-family="Arial" font-size="25" fill="#17324d">E — Exposure: wound, drains, abdomen, temperature</text></svg>