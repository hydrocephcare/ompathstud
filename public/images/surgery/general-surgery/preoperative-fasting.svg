<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><rect width="100%" height="100%" fill="#f8fafc"/><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#15324b">Elective adult preoperative fasting guide</text><rect x="70" y="105" width="860" height="72" rx="14" fill="#e8f1fb" stroke="#7892ad" stroke-width="2"/><text x="500" y="150" text-anchor="middle" font-family="Arial" font-size="26" fill="#17324d">Clear fluids — 2 hours</text><rect x="70" y="195" width="860" height="72" rx="14" fill="#edf6f0" stroke="#7892ad" stroke-width="2"/><text x="500" y="240" text-anchor="middle" font-family="Arial" font-size="26" fill="#17324d">Light meal / non-human milk — 6 hours</text><rect x="70" y="285" width="860" height="72" rx="14" fill="#fff1e8" stroke="#c49a78" stroke-width="2"/><text x="500" y="330" text-anchor="middle" font-family="Arial" font-size="26" fill="#17324d">Fatty / fried food or meat — 8+ hours</text><text x="500" y="395" text-anchor="middle" font-family="Arial" font-size="16" fill="#526579">Typical elective adult intervals only; follow anaesthetic plan and local policy.</text></svg>