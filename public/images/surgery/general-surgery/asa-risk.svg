<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610"><rect width="100%" height="100%" rx="26" fill="#f8fafc"/><text x="500" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#15324b">ASA physical status and perioperative risk</text><g><rect x="58" y="145" width="884" height="62" rx="15" fill="#e8f1fb" stroke="#7892ad" stroke-width="2"/><text x="500" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#17324d">I Healthy</text></g><g><rect x="58" y="233" width="884" height="62" rx="15" fill="#edf6f0" stroke="#7892ad" stroke-width="2"/><text x="500" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#17324d">II Mild systemic disease</text></g><g><rect x="58" y="321" width="884" height="62" rx="15" fill="#e8f1fb" stroke="#7892ad" stroke-width="2"/><text x="500" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#17324d">III Severe systemic disease</text></g><g><rect x="58" y="409" width="884" height="62" rx="15" fill="#edf6f0" stroke="#7892ad" stroke-width="2"/><text x="500" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#17324d">IV Life-threatening disease</text></g><g><rect x="58" y="497" width="884" height="62" rx="15" fill="#e8f1fb" stroke="#7892ad" stroke-width="2"/><text x="500" y="536" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#17324d">V Moribund, unlikely to survive without operation</text></g><text x="500" y="586" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#526579">ASA describes physical status; it is not a complete standalone operative-risk score.</text></svg>