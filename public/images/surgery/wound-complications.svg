<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12304a"/><stop offset="1" stop-color="#1f5274"/></linearGradient><style>text{font-family:Inter,Arial,sans-serif;fill:#17324a}.title{font-size:34px;font-weight:750;fill:#fff}.sub{font-size:17px;fill:#dbeafe}.h{font-size:21px;font-weight:700}.t{font-size:17px}.small{font-size:14px;fill:#526779}.card{fill:#fff;stroke:#d6e2ed;stroke-width:2}.label{font-size:16px;font-weight:700}.line{stroke:#47657c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/><rect width="1200" height="112" rx="28" fill="url(#navy)"/><rect y="84" width="1200" height="28" fill="url(#navy)"/><text x="54" y="52" class="title">Surgical wound complications</text><text x="56" y="82" class="sub">Recognise early • classify the depth • escalate fascial failure and evisceration</text>
<rect x="55" y="150" width="1090" height="465" rx="22" class="card"/>
<g transform="translate(95 205)">
<rect x="0" y="0" width="455" height="135" rx="18" fill="#fde8e6" stroke="#d5e1ea" stroke-width="2"/><text x="24" y="42" class="h">Infection</text><text x="24" y="82" class="t">Redness • warmth • pain • purulent discharge</text><rect x="500" y="0" width="455" height="135" rx="18" fill="#fff2dc" stroke="#d5e1ea" stroke-width="2"/><text x="524" y="42" class="h">Haematoma / seroma</text><text x="524" y="82" class="t">Blood or serous fluid collection</text><rect x="0" y="165" width="455" height="135" rx="18" fill="#eaf2fa" stroke="#d5e1ea" stroke-width="2"/><text x="24" y="207" class="h">Dehiscence</text><text x="24" y="247" class="t">Separation of wound edges; may involve fascia</text><rect x="500" y="165" width="455" height="135" rx="18" fill="#e9f5ee" stroke="#d5e1ea" stroke-width="2"/><text x="524" y="207" class="h">Incisional hernia</text><text x="524" y="247" class="t">Fascial weakness with protrusion through scar</text>
<rect x="0" y="350" width="955" height="55" rx="12" fill="#fff0ee" stroke="#e6b1a8" stroke-width="2"/><text x="22" y="385" class="label">Evisceration / burst abdomen = emergency • cover with sterile saline-moistened dressings • urgent surgical review</text>
</g></svg>