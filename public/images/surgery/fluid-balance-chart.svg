<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12304a"/><stop offset="1" stop-color="#1f5274"/></linearGradient><style>text{font-family:Inter,Arial,sans-serif;fill:#17324a}.title{font-size:34px;font-weight:750;fill:#fff}.sub{font-size:17px;fill:#dbeafe}.h{font-size:21px;font-weight:700}.t{font-size:17px}.small{font-size:14px;fill:#526779}.card{fill:#fff;stroke:#d6e2ed;stroke-width:2}.label{font-size:16px;font-weight:700}.line{stroke:#47657c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/><rect width="1200" height="112" rx="28" fill="url(#navy)"/><rect y="84" width="1200" height="28" fill="url(#navy)"/><text x="54" y="52" class="title">Fluid balance: record input and output</text><text x="56" y="82" class="sub">Measured balance is only one part of the clinical assessment</text>
<rect x="55" y="150" width="1090" height="465" rx="22" class="card"/>
<g transform="translate(100 205)">
<rect x="0" y="0" width="420" height="260" rx="18" fill="#e9f5ee" stroke="#9bcbb5" stroke-width="2"/><text x="30" y="45" class="h">INPUT</text><text x="30" y="90" class="t">Oral drinks and feeds</text><text x="30" y="130" class="t">IV fluids and medications</text><text x="30" y="170" class="t">Blood products</text><text x="30" y="210" class="t">Enteral nutrition</text>
<rect x="580" y="0" width="420" height="260" rx="18" fill="#eaf2fa" stroke="#9bb8d4" stroke-width="2"/><text x="610" y="45" class="h">OUTPUT</text><text x="610" y="90" class="t">Urine</text><text x="610" y="130" class="t">Vomitus / NG aspirates</text><text x="610" y="170" class="t">Drains / stomas / fistulas</text><text x="610" y="210" class="t">Measured blood loss / stool</text>
<path d="M440 130h120" class="line"/><path d="M550 120l12 10 -12 10" fill="none" stroke="#47657c" stroke-width="3"/>
<rect x="260" y="310" width="480" height="80" rx="16" fill="#fff2dc" stroke="#e6c98f" stroke-width="2"/><text x="500" y="342" text-anchor="middle" class="h">Balance = total input − total output</text><text x="500" y="370" text-anchor="middle" class="small">Also assess insensible losses, weight, perfusion and lungs</text>
</g></svg>