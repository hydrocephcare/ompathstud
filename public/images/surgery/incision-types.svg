<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12304a"/><stop offset="1" stop-color="#1f5274"/></linearGradient>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#17324a}
 .title{font-size:34px;font-weight:750;fill:#fff}.sub{font-size:17px;fill:#dbeafe}
 .h{font-size:21px;font-weight:700}.t{font-size:17px}.small{font-size:14px;fill:#526779}
 .card{fill:#fff;stroke:#d6e2ed;stroke-width:2}.line{stroke:#47657c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
 .red{stroke:#d94c4c;stroke-width:8;fill:none;stroke-linecap:round}.blue{stroke:#2476b8;stroke-width:7;fill:none;stroke-linecap:round}.green{stroke:#16876b;stroke-width:7;fill:none;stroke-linecap:round}
 .label{font-size:16px;font-weight:700}.muted{fill:#637b8e}
 </style>
</defs>
<rect width="1200" height="720" rx="28" fill="url(#bg)"/>
<rect x="0" y="0" width="1200" height="112" rx="28" fill="url(#navy)"/>
<rect x="0" y="84" width="1200" height="28" fill="url(#navy)"/>
<text x="54" y="52" class="title">Common abdominal surgical incisions</text><text x="56" y="82" class="sub">Schematic overview • incision choice depends on the operation and required exposure</text>
<rect x="55" y="145" width="430" height="520" rx="22" class="card"/>
<path d="M270 180 C190 190 155 245 165 320 L175 540 C180 610 225 635 270 638 C315 635 360 610 365 540 L375 320 C385 245 350 190 270 180Z" fill="#f2c9ae" stroke="#c58e75" stroke-width="4"/>
<path d="M270 190 L270 625" class="red"/>
<path d="M182 265 Q270 275 358 265" class="blue"/>
<path d="M175 300 L235 350" class="green"/>
<path d="M305 350 L370 300" class="green"/>
<path d="M180 555 Q270 575 360 555" stroke="#a65c9a" stroke-width="8" fill="none" stroke-linecap="round"/>
<path d="M180 255 L360 255" stroke="#d49b26" stroke-width="8" fill="none" stroke-linecap="round"/>
<text x="270" y="685" text-anchor="middle" class="small">Anterior abdominal wall (schematic)</text>
<rect x="520" y="145" width="625" height="520" rx="22" class="card"/>
<g transform="translate(555 178)">
<path d="M0 0h44" class="red"/><text x="60" y="6" class="label">Midline laparotomy</text><text x="60" y="31" class="small">Linea alba • rapid, broad abdominal access</text>
<path d="M0 92h44" class="blue"/><text x="60" y="98" class="label">Transverse incision</text><text x="60" y="123" class="small">Horizontal access • selected abdominal procedures</text>
<path d="M0 184h44" class="green"/><text x="60" y="190" class="label">Oblique incisions</text><text x="60" y="215" class="small">McBurney / Lanz • right iliac fossa</text>
<path d="M0 276h44" stroke="#a65c9a" stroke-width="8"/><text x="60" y="282" class="label">Pfannenstiel</text><text x="60" y="307" class="small">Curved suprapubic transverse incision</text>
<path d="M0 368h44" stroke="#d49b26" stroke-width="8"/><text x="60" y="374" class="label">Kocher / subcostal</text><text x="60" y="399" class="small">Below costal margin • upper abdominal access</text>
</g></svg>