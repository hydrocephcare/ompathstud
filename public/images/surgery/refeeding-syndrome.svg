<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12304a"/><stop offset="1" stop-color="#1f5274"/></linearGradient>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#17324a}
 .title{font-size:34px;font-weight:750;fill:#fff}.sub{font-size:17px;fill:#dbeafe}
 .h{font-size:21px;font-weight:700}.t{font-size:17px}.small{font-size:14px;fill:#526779}
 .card{fill:#fff;stroke:#d6e2ed;stroke-width:2}.line{stroke:#47657c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
 .red{stroke:#d94c4c;stroke-width:8;fill:none;stroke-linecap:round}.blue{stroke:#2476b8;stroke-width:7;fill:none;stroke-linecap:round}.green{stroke:#16876b;stroke-width:7;fill:none;stroke-linecap:round}
 .label{font-size:16px;font-weight:700}.muted{fill:#637b8e}
 </style>
</defs>
<rect width="1200" height="720" rx="28" fill="url(#bg)"/>
<rect x="0" y="0" width="1200" height="112" rx="28" fill="url(#navy)"/>
<rect x="0" y="84" width="1200" height="28" fill="url(#navy)"/>
<text x="54" y="52" class="title">Refeeding syndrome: the mechanism</text><text x="56" y="82" class="sub">Insulin-driven intracellular shifts after nutrition is restarted in a severely undernourished patient</text>
<rect x="55" y="150" width="1090" height="465" rx="22" class="card"/>
<g transform="translate(95 210)">
<rect x="0" y="0" width="930" height="72" rx="14" fill="#eef3f8" stroke="#d5e1ea" stroke-width="1.5"/><text x="22" y="29" class="label">Starvation</text><text x="290" y="29" class="t">Low insulin • depleted total-body phosphate, K⁺ and Mg²⁺</text><path d="M465 72v18" class="line"/><path d="M455 82l10 10 10 -10" fill="none" stroke="#47657c" stroke-width="3"/><rect x="0" y="94" width="930" height="72" rx="14" fill="#fff2dc" stroke="#d5e1ea" stroke-width="1.5"/><text x="22" y="123" class="label">Carbohydrate reintroduced</text><text x="290" y="123" class="t">Blood glucose rises → insulin secretion increases</text><path d="M465 166v18" class="line"/><path d="M455 176l10 10 10 -10" fill="none" stroke="#47657c" stroke-width="3"/><rect x="0" y="188" width="930" height="72" rx="14" fill="#e9f5ee" stroke="#d5e1ea" stroke-width="1.5"/><text x="22" y="217" class="label">Intracellular shift</text><text x="290" y="217" class="t">Phosphate, potassium and magnesium move into cells</text><path d="M465 260v18" class="line"/><path d="M455 270l10 10 10 -10" fill="none" stroke="#47657c" stroke-width="3"/><rect x="0" y="282" width="930" height="72" rx="14" fill="#fff0ee" stroke="#d5e1ea" stroke-width="1.5"/><text x="22" y="311" class="label">Clinical consequences</text><text x="290" y="311" class="t">Hypophosphataemia • weakness • arrhythmia • respiratory failure</text>
<text x="0" y="420" class="small">Prevention: identify risk • thiamine • cautious calorie initiation • monitor and replace electrolytes • monitor fluid balance.</text>
</g></svg>