<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12304a"/><stop offset="1" stop-color="#1f5274"/></linearGradient>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#17324a}
 .title{font-size:34px;font-weight:750;fill:#fff}.sub{font-size:17px;fill:#dbeafe}
 .h{font-size:21px;font-weight:700}.t{font-size:17px}.small{font-size:14px;fill:#526779}
 .card{fill:#fff;stroke:#d6e2ed;stroke-width:2}.line{stroke:#47657c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
 .red{stroke:#d94c4c;stroke-width:8;fill:none;stroke-linecap:round}.blue{stroke:#2476b8;stroke-width:7;fill:none;stroke-linecap:round}.green{stroke:#16876b;stroke-width:7;fill:none;stroke-linecap:round}
 .label{font-size:16px;font-weight:700}.muted{fill:#637b8e}
 </style>
</defs>
<rect width="1200" height="720" rx="28" fill="url(#bg)"/>
<rect x="0" y="0" width="1200" height="112" rx="28" fill="url(#navy)"/>
<rect x="0" y="84" width="1200" height="28" fill="url(#navy)"/>
<text x="54" y="52" class="title">Routes of nutritional support</text><text x="56" y="82" class="sub">Choose the safest effective route that meets the patient's requirements</text>
<rect x="55" y="150" width="1090" height="465" rx="22" class="card"/>
<g transform="translate(100 205)">
<rect x="0" y="0" width="300" height="300" rx="22" fill="#e9f5ee" stroke="#9bcbb5" stroke-width="2"/><text x="150" y="48" text-anchor="middle" class="h">Oral nutrition</text><circle cx="150" cy="125" r="45" fill="#fff" stroke="#16876b" stroke-width="4"/><path d="M125 125h50 M150 100v50" stroke="#16876b" stroke-width="5"/><text x="150" y="210" text-anchor="middle" class="t">Mouth → GI tract</text><text x="150" y="245" text-anchor="middle" class="small">If safe swallowing and adequate intake</text>
<rect x="350" y="0" width="300" height="300" rx="22" fill="#eaf2fa" stroke="#9bb8d4" stroke-width="2"/><text x="500" y="48" text-anchor="middle" class="h">Enteral nutrition</text><path d="M500 95v95q0 40 40 40" stroke="#2476b8" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="465" y="82" width="70" height="25" rx="8" fill="#fff" stroke="#2476b8" stroke-width="3"/><text x="500" y="210" text-anchor="middle" class="t">Tube → stomach / bowel</text><text x="500" y="245" text-anchor="middle" class="small">Use when gut works but oral intake fails</text>
<rect x="700" y="0" width="300" height="300" rx="22" fill="#fff0ee" stroke="#e6b1a8" stroke-width="2"/><text x="850" y="48" text-anchor="middle" class="h">Parenteral nutrition</text><path d="M850 90v90 M820 115h60 M850 180v35" stroke="#d94c4c" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="810" y="70" width="80" height="55" rx="10" fill="#fff" stroke="#d94c4c" stroke-width="3"/><text x="850" y="250" text-anchor="middle" class="t">IV → bloodstream</text><text x="850" y="275" text-anchor="middle" class="small">When GI route is unusable / inadequate</text>
</g>
<text x="600" y="570" text-anchor="middle" class="h">Principle: if the gastrointestinal tract is functional and accessible, prefer enteral nutrition.</text></svg>